name: Local Docker CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (all, lint, analyze, test)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - lint
          - analyze
          - test

jobs:
  docker-ci:
    name: Docker CI Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/builder
            /root/flutter/.pub-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('**/pubspec.yaml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-docker-${{ hashFiles('**/pubspec.yaml') }}
      
      - name: Build Docker image
        run: |
          docker build -t opencloset-ci:latest .
      
      - name: Run selected stage
        run: |
          STAGE="${{ github.event.inputs.stage || 'all' }}"
          
          case $STAGE in
            all)
              docker-compose up --build --no-deps pipeline
              ;;
            lint)
              docker-compose up --build --no-deps lint
              ;;
            analyze)
              docker-compose up --build --no-deps analyze
              ;;
            test)
              docker-compose up --build --no-deps test
              ;;
          esac
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore
