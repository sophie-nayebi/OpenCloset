name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    name: Lint (Format & Analyze)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull lint Docker image
        run: |
          echo "Pulling lint Docker image..."
          docker pull open-closet:lint

      - name: Run lint stage with Docker
        run: |
          echo "Running lint stage in Docker container..."
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            --workdir /workspace \
            open-closet:lint

      - name: Run Flutter format (check)
        run: flutter format --set-exit-if-changed .

      - name: Run Flutter analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull test Docker image
        run: |
          echo "Pulling test Docker image..."
          docker pull open-closet:test

      - name: Run test stage with Docker
        run: |
          echo "Running test stage in Docker container..."
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            --workdir /workspace \
            open-closet:test

      - name: Check coverage threshold
        run: |
          COVERAGE_THRESHOLD="${{ env.COVERAGE_THRESHOLD:-80}}"
          # Parse total coverage percentage from lcov.info (last coverage line)
          COVERAGE_RESULT=$(grep -m1 "^coverage: " coverage/lcov.info | sed 's/.*: \([0-9.]*\)%.*/\1/')
          if [ -z "$COVERAGE_RESULT" ]; then
            echo "❌ Error: Could not parse coverage result from lcov.info"
            echo "   Expected format: coverage: XX.X% in file"
            exit 1
          fi
          if [ $(python3 -c "print(1 if float('$COVERAGE_RESULT') < float('$COVERAGE_THRESHOLD') else 0)") -eq 1 ]; then
            echo "❌ Coverage check failed: ${COVERAGE_RESULT}% < ${COVERAGE_THRESHOLD}%"
            echo "   Current coverage: ${COVERAGE_RESULT}%"
            echo "   Required coverage: ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage check passed: ${COVERAGE_RESULT}% >= ${COVERAGE_THRESHOLD}%"
          echo "   Current coverage: ${COVERAGE_RESULT}%"
          echo "   Required coverage: ${COVERAGE_THRESHOLD}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          flags: flutter

  pipeline:
    name: Full Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull pipeline Docker image
        run: |
          echo "Pulling pipeline Docker image..."
          docker pull open-closet:pipeline

      - name: Run full pipeline with Docker
        run: |
          echo "Running full pipeline in Docker container..."
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            --workdir /workspace \
            open-closet:pipeline
